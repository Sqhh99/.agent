name: 功能请求
description: 已能说清要解决什么问题的请求
title: "Feature: "
labels: ["enhancement"]
body:
  - type: checkboxes
    id: prerequisites
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索过 Issues 和 Discussions
          required: true
        - label: 我写的是要解决的问题，而不只是实现方案
          required: true
  - type: textarea
    id: problem
    attributes:
      label: 要解决什么问题
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的使用方式
    validations:
      required: true
