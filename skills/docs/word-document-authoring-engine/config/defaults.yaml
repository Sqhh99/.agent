document:
  paper: A4
  margins_cm:
    top: 2.5
    bottom: 2.5
    left: 2.6
    right: 2.6
  body_font_cjk: Noto Serif CJK SC
  heading_font_cjk: Noto Sans CJK SC
  body_size_pt: 10.5
  line_spacing: 1.5
  first_line_indent_chars: 2
  header: document_short_title
  footer: centered_page_number

content:
  logic_chain:
    - demand_and_problem
    - traditional_method_and_limitations
    - proposed_solution
    - system_and_equipment
    - algorithm_and_formula
    - implementation_and_validation
    - risk_and_benefit
    - conclusion
  distinguish_claim_types: true
  claim_types:
    - confirmed_fact
    - source_supported
    - recommended_value
    - engineering_inference
    - field_validation_required
  prohibit_scope_invention: true
  prohibit_adjacent_model_mixing: true

visual:
  palette: monochrome_or_restrained_blue
  figure_title_inside_image: false
  figure_caption_position: below
  prevent_overlap: true
  decorative_images: false
  table_density: low
  long_prose_in_tables: false

research:
  use_web_when_information_insufficient: true
  prefer_primary_sources: true
  gap_priority: [P0, P1, P2]
  key_claim_min_evidence: one_authoritative_or_two_independent

quality:
  render_docx_to_png: mandatory
  inspect_every_page: mandatory
  repeat_until_clean: true
  deliver_intermediate_files: false
